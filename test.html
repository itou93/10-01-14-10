<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像認識ARテスト</title>

    <!-- A-Frame と MindAR の読み込み -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <!-- GLTFアニメーション再生用ライブラリ -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10000;
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
            border: 2px solid #ffffff;
        }

        /* --- MindARデフォルトのスキャンUIを無効化 --- */
        .mindar-ui-overlay, .mindar-ui-scanning {
            display: none !important;
        }

        /* --- 画面全体を覆うUIエリア --- */
        .scan-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        /* 検出時に全体を表示 */
        .scan-overlay.active {
            opacity: 1;
        }

        /* 枠線の共通スタイル */
        .corner {
            position: absolute;
            width: 60px;
            height: 60px;
            border-color: #10b981; /* エメラルドグリーン */
            border-style: solid;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.27);
        }

        /* 角の位置・初期アニメーション位置 */
        .corner-top-left {
            top: 50%; left: 50%;
            border-width: 6px 0 0 6px;
            border-top-left-radius: 16px;
            transform: translate(-50vw, -50vh);
        }
        
        .corner-top-right {
            top: 50%; left: 50%;
            border-width: 6px 6px 0 0;
            border-top-right-radius: 16px;
            transform: translate(calc(50vw - 60px), -50vh);
        }

        .corner-bottom-left {
            top: 50%; left: 50%;
            border-width: 0 0 6px 6px;
            border-bottom-left-radius: 16px;
            transform: translate(-50vw, calc(50vh - 60px));
        }

        .corner-bottom-right {
            top: 50%; left: 50%;
            border-width: 0 6px 6px 0;
            border-bottom-right-radius: 16px;
            transform: translate(calc(50vw - 60px), calc(50vh - 60px));
        }

        /* 検出時（active）：中央に集まる */
        .scan-overlay.active .corner-top-left { transform: translate(-120px, -120px); }
        .scan-overlay.active .corner-top-right { transform: translate(60px, -120px); }
        .scan-overlay.active .corner-bottom-left { transform: translate(-120px, 60px); }
        .scan-overlay.active .corner-bottom-right { transform: translate(60px, 60px); }

        /* 中央メッセージ */
        .scan-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, 140px);
            background: rgba(16, 185, 129, 0.95);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #ffffff;
        }

        /* --- スタンプ獲得ダイアログのCSS --- */
        .stamp-dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 20000;
            display: none; /* 通常は非表示 */
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .stamp-dialog-box {
            background: #ffffff;
            width: 85%;
            max-width: 340px;
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.27);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">← 戻る</a>

    <!-- 画面四角から集まるスキャンUI -->
    <div id="scan-overlay" class="scan-overlay">
        <div class="corner corner-top-left"></div>
        <div class="corner corner-top-right"></div>
        <div class="corner corner-bottom-left"></div>
        <div class="corner corner-bottom-right"></div>
        <div class="scan-message">🔍 ターゲット検出！</div>
    </div>

    <!-- MindAR シーン -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets3.mind; uiScanning: no;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
      
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- ターゲット認識で Mayaキャラクター（kougyo2.glb）を出力 -->
        <a-entity mindar-image-target="targetIndex: 0" id="target-object">
            <a-entity 
                gltf-model="kougyo2.glb" 
                position="0 0 0" 
                rotation="0 0 0" 
                scale="0.1 0.1 0.1" 
                animation-mixer="clip: *; loop: repeat">
            </a-entity>
        </a-entity>

    </a-scene>

    <!--  スタンプ獲得ポップアップ -->
    <div id="stamp-dialog" class="stamp-dialog-overlay">
        <div class="stamp-dialog-box">
            <h3 style="margin-top: 0; color: #059669; font-size: 20px;">🎉 スタンプ獲得！</h3>
            <p style="font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 20px;">
                オブジェクトを検出して<br>キャラクターが出現しました！<br>マップを開いて確認しますか？
            </p>
            <div style="display: flex; gap: 10px;">
                <button onclick="closeStampDialog()" style="flex: 1; padding: 10px; border: none; background: #94a3b8; color: white; border-radius: 10px; font-weight: bold; cursor: pointer;">閉じる</button>
                <button onclick="goToMap()" style="flex: 1; padding: 10px; border: none; background: #f59e0b; color: white; border-radius: 10px; font-weight: bold; cursor: pointer;">マップへGO!</button>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const scanOverlay = document.getElementById('scan-overlay');
            const targetObject = document.getElementById('target-object');
            const stampDialog = document.getElementById('stamp-dialog');

            if (targetObject) {
                targetObject.addEventListener('targetFound', () => {
                    // 1. スキャン枠アニメーション表示
                    scanOverlay.classList.add('active');

                    // 2. スタンプ達成の記録
                    localStorage.setItem('stamp-a-done', '1');

                    // 3. Mayaキャラが出現後、3秒待ってからスタンプダイアログを表示
                    setTimeout(() => {
                        stampDialog.style.display = 'flex';
                    }, 3000);
                });

                targetObject.addEventListener('targetLost', () => {
                    scanOverlay.classList.remove('active');
                });
            }
        });

        function closeStampDialog() {
            document.getElementById('stamp-dialog').style.display = 'none';
        }

        function goToMap() {
            window.location.href = 'map.html';
        }
    </script>
</body>
</html>
